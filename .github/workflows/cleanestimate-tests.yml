name: CleanEstimate tests

on:
  pull_request:
  push:
    branches:
      - main
      - "security/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      SESSION_SECRET: cleanestimate-ci-test-session-secret
      STRIPE_WEBHOOK_SECRET: whsec_test_only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest \
            "email-validator>=2.3.0" \
            "flask-login>=0.6.3" \
            "flask>=3.1.2" \
            "flask-sqlalchemy>=3.1.1" \
            "pillow>=11.3.0" \
            "psycopg2-binary>=2.9.10" \
            "qrcode>=8.2" \
            "reportlab>=4.4.3" \
            "requests>=2.32.5" \
            "sendgrid>=6.12.4" \
            "werkzeug>=3.1.3" \
            "sqlalchemy>=2.0.43" \
            "flask-wtf>=1.2.2" \
            "bleach>=6.2.0" \
            "stripe>=12.0.0"
      - name: Run webhook security regression tests
        run: python -m pytest -q
